name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Disparador manual desde la pestaña Actions. No cuesta nada tenerlo y evita el commit vacío de
  # turno cuando hay que comprobar si el workflow corre siquiera — que es exactamente el caso en el
  # que un push no genera ninguna ejecución y no se sabe si el problema es el archivo o los
  # permisos del repositorio.
  workflow_dispatch:

# Un push nuevo sobre la misma rama cancela el build anterior: no tiene sentido pagar dos
# ejecuciones por un commit que ya está superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# El workflow solo lee el repositorio: compila, prueba y sube artefactos. Sin esto, el token del job
# tiene los permisos por defecto del repositorio, que pueden incluir escribir en él.
permissions:
  contents: read

jobs:
  jvm:
    name: Tests y publicación
    # Fijado y no `ubuntu-latest`: el FFmpeg que valida la salida viene del apt de la imagen, y con
    # la imagen cambia de versión —y con ella sus avisos y el redondeo de sus duraciones— sin que
    # cambie nada del repositorio. Con 24.04 es FFmpeg 6.1. Subirlo es un commit deliberado.
    runs-on: ubuntu-24.04
    # La suite tarda unos minutos; un job que pasa de media hora está colgado, y así lo dice en vez
    # de consumir las seis horas que GitHub concede por defecto.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # `actions/checkout` restaura los permisos tal y como están en el índice de git, y todos los
      # pasos de abajo invocan `./gradlew` directamente. Si el archivo pierde su bit de ejecución,
      # el primero de ellos muere con `Permission denied` (salida 126): un síntoma que no se parece
      # en nada a la causa, en un cambio que además es invisible en el diff — `git` lo registra
      # como `1 file changed, 0 insertions(+), 0 deletions(-)`.
      #
      # No es hipotético: un wrapper añadido en modo 100644 deja el workflow sin poder terminar ni
      # una vez, y no es solo el CI — `jitpack.yml` invoca el wrapper igual, así que la publicación
      # del primer tag falla también.
      #
      # Se comprueba en vez de hacer `chmod +x` a ciegas a propósito: un `chmod` deja el CI en
      # verde y el repositorio roto para todo lo demás, que es la forma de que esto vuelva sin que
      # nadie se entere. Aquí el fallo dice qué pasó y cómo se arregla.
      - name: Bit de ejecución de gradlew
        run: |
          modo=$(git ls-files -s gradlew | cut -d' ' -f1)
          if [ "$modo" != "100755" ]; then
            echo "::error file=gradlew::gradlew está en modo $modo y hace falta 100755."
            echo "Sin el bit de ejecución, './gradlew' falla con 'Permission denied' en este"
            echo "runner y en el constructor de JitPack. Se arregla con:"
            echo "    git update-index --chmod=+x gradlew"
            echo "    git commit -m 'Restaurar el bit de ejecución de gradlew'"
            exit 1
          fi
          test -x gradlew || { echo "::error::gradlew no es ejecutable en el working tree"; exit 1; }
          echo "gradlew: modo $modo, ejecutable. OK"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Sin ffmpeg los tests de integración end-to-end se omiten en silencio (assumeTrue), así que
      # el CI pasaría sin ejecutar justo la cobertura que valida la salida real contra un
      # decodificador de verdad. Los tests que buscan descriptores abiertos con `OpenFiles` miden aquí
      # leyendo /proc/self/fd; en Windows miden de otra forma —un archivo abierto no se deja
      # renombrar— y solo en macOS se omiten. No se cuentan: cada test nuevo dejaba la cifra vieja.
      # La versión queda en el registro: un aviso nuevo de FFmpeg en un test se entiende antes si se
      # ve en qué versión salió.
      - name: FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          ffmpeg -version

      - uses: gradle/actions/setup-gradle@v4

      # La compatibilidad de API la vigila `PublicApiTest`, que ya va dentro de `test`: compara la
      # superficie pública contra un volcado versionado y falla si cambia.
      - name: Tests
        run: ./gradlew test

      # Comprueba que el artefacto se puede publicar de verdad, que es lo que consume JitPack.
      - name: Publicación a Maven local
        run: ./gradlew publishToMavenLocal

      # El Kotlin de la app que consume la librería es el techo, no el de este proyecto: un
      # artefacto con metadata demasiado nueva no compila en esa app, y ningún test de aquí lo ve
      # (así se rompió la 1.0.0). Este proyecto compila y ejecuta con Kotlin 1.9 contra el artefacto
      # que se acaba de publicar.
      #
      # Usa su propio wrapper, fijado en Gradle 8, porque el plugin de Kotlin 1.9 no funciona con
      # Gradle 9: así subir el Gradle del proyecto no rompe esta comprobación. Va con `sh` para no
      # depender del bit de ejecución de ese segundo `gradlew`.
      - name: Consumidor con Kotlin 1.9
        working-directory: compat/kotlin-1.9
        run: |
          version=$(grep -oP '^version = "\K[^"]+' ../../build.gradle.kts)
          sh ./gradlew run --no-configuration-cache -PkotmpegVersion="$version"

      - name: Informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore

  # Los benchmarks JMH de `benchmarks/`, en paralelo con los tests. Falla si algún benchmark reserva
  # por operación más memoria que su límite de `benchmarks/limites.properties`: es la medida que no
  # depende de la máquina, y la que retrocede cuando algo que se leía bajo demanda vuelve a cargarse
  # entero. Los tiempos van al resumen del job y al artefacto, pero no se vigilan: en un runner
  # compartido varían más que cualquier regresión que importe.
  benchmarks:
    name: Benchmarks
    # La misma imagen que los tests, para que los dos jobs midan sobre el mismo sistema.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: JMH
        run: ./gradlew -p benchmarks verificarLimites

      - name: Resumen
        if: always()
        run: |
          if [ -f benchmarks/build/results/jmh/resumen.md ]; then
            cat benchmarks/build/results/jmh/resumen.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: benchmarks/build/results/jmh/
          if-no-files-found: ignore
