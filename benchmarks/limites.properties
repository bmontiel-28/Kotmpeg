# Bytes reservados por operación que cada benchmark no puede superar (`gc.alloc.rate.norm` de JMH).
# Los vigila `./gradlew -p benchmarks verificarLimites`. Un valor sube solo con un motivo escrito en
# el commit: casi siempre es memoria que vuelve a cargarse entera en vez de leerse bajo demanda.
#
# Referencia: en la 3.0.0 abrir el MP4 de dos horas reservaba unos 30 MB solo en el mapa de muestras.
Mp4DemuxerBenchmark.openPlain=3000000
Mp4DemuxerBenchmark.openFragmented=8000000
# Leer entero reserva sobre todo los paquetes (unos 105 bytes cada uno, 770 000 paquetes).
Mp4DemuxerBenchmark.readAllPlain=90000000
Mp4SeekBenchmark.seekPlain=1024
Mp4SeekBenchmark.seekAndReadPlain=4096
Mp4SeekBenchmark.seekFragmented=32768
# El muxer sí guarda su tabla de muestras hasta stop(): es lo que escribe en el moov.
Mp4MuxerBenchmark.writeTwoHours=160000000
PcmBenchmark.mixWithoutGains=2400
PcmBenchmark.mixWithGains=2400
PcmBenchmark.resample441To48=1200
PcmBenchmark.streamMixer=10240
