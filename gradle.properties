# Ajustes de Gradle para todo el proyecto. Los que configure el IDE por su cuenta mandan sobre
# estos.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Con la caché de configuración, Gradle se salta la fase de configuración entera si nada que la
# afecte ha cambiado. La `-Dkotmpeg.api.update` de `PublicApiTest` se lee con un `provider`, así
# que cambiarla invalida la caché en vez de quedarse pegada.
org.gradle.configuration-cache=true

kotlin.code.style=official
